
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker App</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <!-- Header -->
        <header class="text-center mb-5">
            <h1 class="fw-bold">💰 Expense Tracker</h1>
            <p>Manage your daily expenses easily</p>
        </header>

        <!-- Total Expenses -->
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <div class="card text-center p-4">
                    <h5>Total Expenses</h5>
                    <h2 id="total-expenses">₹0.00</h2>
                </div>
            </div>
        </div>

        <!-- Add Expense Form -->
        <div class="card mb-4">
            <div class="card-body p-4">

                <h4 class="mb-3">Add New Expense</h4>

                <form id="expense-form">

                    <div class="mb-3">
                        <label for="expense-name" class="form-label">
                            Expense Name
                        </label>

                        <input
                            type="text"
                            id="expense-name"
                            class="form-control"
                            placeholder="e.g. Groceries"
                            maxlength="80"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="expense-amount" class="form-label">
                            Amount (₹)
                        </label>

                        <input
                            type="number"
                            id="expense-amount"
                            class="form-control"
                            placeholder="Enter amount"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="expense-category" class="form-label">
                            Category
                        </label>

                        <select
                            id="expense-category"
                            class="form-select"
                            required
                        >
                            <option value="">Choose category</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        + Add Expense
                    </button>

                </form>

                <div
                    id="message"
                    class="mt-3"
                    role="status"
                    aria-live="polite"
                ></div>

            </div>
        </div>

        <!-- Expense History -->
        <div class="card">
            <div class="card-body p-4">

                <h4 class="mb-3">Expense History</h4>

                <div class="table-responsive">

                    <table class="table table-striped table-hover">

                        <thead>
                            <tr>
                                <th>Expense</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="expense-list">
                            <!-- JavaScript adds expenses here -->
                        </tbody>

                    </table>

                </div>

            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center mt-4">
            <p>Expense Tracker | Built with HTML, CSS, Bootstrap & JavaScript</p>
        </footer>

    </div>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>
</html>

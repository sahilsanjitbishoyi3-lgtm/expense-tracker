<!-- Bootstrap CSS -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<div class="container py-5">
  <div class="text-center mb-4">
    <h1 class="fw-bold">💰 Expense Tracker</h1>
    <p class="text-muted">Manage your daily expenses easily</p>
  </div>

  <!-- Summary Card -->
  <div class="row mb-4">
    <div class="col-md-6 mx-auto">
      <div class="card shadow-sm text-center p-4">
        <h5>Total Expenses</h5>
        <h2 class="text-primary fw-bold" id="total-expenses">₹0.00</h2>
      </div>
    </div>
  </div>

  <!-- Add Expense Form -->
  <div class="card shadow-sm mb-4">
    <div class="card-body p-4">
      <h4 class="mb-3">Add New Expense</h4>

      <form id="expense-form">
        <div class="mb-3">
          <label class="form-label">Expense Name</label>
          <input
            type="text"
            id="expense-name"
            class="form-control"
            placeholder="e.g. Groceries"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Amount (₹)</label>
          <input
            type="number"
            id="expense-amount"
            class="form-control"
            placeholder="Enter amount"
            min="0.01"
            step="0.01"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Category</label>
          <select id="expense-category" class="form-select" required>
            <option value="">Choose category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">
          + Add Expense
        </button>
      </form>
    </div>
  </div>

  <!-- Expense List -->
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-3">Expense History</h4>

      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>Expense</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="expense-list">
            <tr>
              <td colspan="4" class="text-center text-muted">
                No expenses added yet.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
